name: horse-racing

services:
  app:
    build:
      context: .
    image: ${APP_IMAGE:-horse-racing:lab4}
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      APP_RELOAD: "false"
      DATABASE_URL: postgresql://${APP_DB_USER:-horse}:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env.compose}@db:5432/${POSTGRES_DB:-horse_racing}?connect_timeout=5
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PUBLISHED_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 20s
    networks:
      - frontend
      - backend
    mem_limit: 256m
    cpus: 0.5

  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    user: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ${POSTGRES_DB:-horse_racing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.compose}
      APP_DB_USER: ${APP_DB_USER:-horse}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env.compose}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ops/postgres/01-app-user.sql:/docker-entrypoint-initdb.d/01-app-user.sql:ro
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 30s

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  pgdata:
