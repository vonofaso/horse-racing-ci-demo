# Disposable acceptance fixture; production Compose belongs to participant 2.
services:
  app:
    build:
      context: ../..
    environment:
      DATABASE_URL: postgresql://horse:${CONTAINER_CHECK_PASSWORD:?generated by checker}@db:5432/horse_racing
      APP_RELOAD: "false"
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 100
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
  db:
    image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74
    # The official entrypoint can initialise a new volume as postgres (UID 999).
    user: "999:999"
    environment:
      POSTGRES_USER: horse
      POSTGRES_PASSWORD: ${CONTAINER_CHECK_PASSWORD:?generated by checker}
      POSTGRES_DB: horse_racing
    volumes: [data:/var/lib/postgresql/data]
    networks: [backend]
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 200
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 30s
networks:
  backend:
    internal: true
volumes:
  data:
